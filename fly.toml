# The Arclis keeper.
#
# Publishes oracle prices, cranks funding, runs the liquidator and watches for
# corporate actions. It is the reason the site shows a live price rather than
# "Oracle update delayed", and it has to stay up to do that.

app = "arclis-keeper"
primary_region = "iad"

# These two belong up here, above every table, and that is the whole point.
#
# In TOML a bare key after a table header belongs to that table. They were
# written below `[[http_service.checks]]`, so they parsed as properties of the
# health check, Fly ignored them, and the graceful drain they describe was
# never configured. `fly launch` rewrote the file and dropped them, which is
# how it was noticed: it was not discarding settings, it was discarding keys
# that had never done anything.
#
# What they are for: the keeper handles SIGTERM by aborting its loops and
# letting in-flight sends settle. Thirty seconds is more than that needs and
# stops a deploy from killing a transaction mid-confirmation.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "keeper/Dockerfile"

# Public configuration only. Everything here is on-chain or in the frontend
# bundle already. The keypair and the price-feed key are secrets, set with
# `fly secrets set` - see keeper/README.md.
[env]
  # RPC_URL is not set here on purpose: set it as a secret, since a dedicated
  # endpoint's URL carries its API key. Unset, the keeper falls back to the
  # public devnet endpoint (see keeper/src/run.ts).
  PROGRAM_ID = "BuN69a1vsMdPQx6bWjaA7FJMbnBKo6yZ66cHrdyiTbiP"
  QUOTE_MINT = "8nMZjpyLpGGtnCkdCotT8jWUDUpSnJeVjeuazyYVvqGu"
  MARKETS = "AAPL,NVDA,MSFT,TSLA,GOOGL,AMZN,META,AVGO,PLTR,AMD,COIN,HOOD,MSTR,SPY,QQQ"
  # One Finnhub quote per market per pass, and the free tier allows sixty a
  # minute. Fifteen markets every twenty seconds is forty-five, which leaves
  # room; every ten seconds would be ninety and get the feed rate limited. The
  # program's staleness bound is sixty seconds, so twenty is still well inside.
  PRICE_INTERVAL_MS = "20000"
  # The public devnet endpoint rate limits per IP, and with fifteen markets the
  # defaults (liquidation scan every 5s, funding crank every 60s) were enough
  # on their own to draw a solid wall of 429s. Funding accrues hourly on chain,
  # so cranking every five minutes loses nothing; a thirty-second liquidation
  # scan is ample for devnet positions. A dedicated RPC (RPC_URL as a secret)
  # is the real fix, and these can come back down once one is set.
  LIQUIDATOR_INTERVAL_MS = "30000"
  FUNDING_INTERVAL_MS = "300000"
  HEALTH_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # "off", and this is the setting that matters most in the file.
  #
  # Fly's defaults suspend a machine that has no inbound traffic and wake it on
  # the next request. That is right for a web app and fatal here: nothing ever
  # requests anything of the keeper, so it would be suspended within minutes
  # and the oracle would go stale. It is a worker that happens to answer a
  # health check, not a service.
  #
  # Spelled as a string rather than `false`: Fly's schema moved to
  # "off"/"stop"/"suspend" and normalises the old boolean to this anyway.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "1m0s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# Deploy with `fly deploy --ha=false`, always.
#
# Fly creates a second machine by default for zero-downtime deploys, which is
# right for a web app and wrong for this. Two keepers sign with the same key
# and publish on their own ten-second timers: every price is written twice, the
# fee is paid twice, and the oracle's transaction history - which is where the
# interface's chart reads its candles from - fills with duplicate prints.
#
# There is no fly.toml key for "never more than one". `min_machines_running`
# sets a floor, not a ceiling. The flag on the deploy is the only control, so
# it has to be remembered, which is why it is written here.
#
#   fly deploy --ha=false
#   fly scale count 1      # to undo a deploy that already made two

[[vm]]
  size = "shared-cpu-1x"
  # 512MB rather than 256. @solana/web3.js and the Anchor coder are not small,
  # and a keeper that is OOM-killed every few hours is worse than one that
  # costs marginally more.
  memory = "512mb"
