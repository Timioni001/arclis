<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Arclis · On-chain access to public markets</title>
    <meta
      name="description"
      content="Arclis: look up any tokenized stock on Solana and see its real backing, custody and redemption rights, then trade it on a perpetual that respects market hours, halts, splits and dividends."
    />
    <!-- The mark. `brand/mark.svg` is the source; the PNGs are rasterised
         from the same numbers by `scripts/make-icons.py`, because iOS home
         screens and every social scraper still refuse an SVG. Without these
         the tab shows a blank sheet of paper and a shared link unfurls as a
         grey rectangle, which is the first thing anyone sees of the project
         and the cheapest thing to get wrong. -->
    <link rel="icon" type="image/svg+xml" href="/brand/mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews. `og:image` has to be an absolute URL: a scraper fetches
         it from its own servers with no page to resolve a relative path
         against. VITE_SITE_URL is substituted at build time and left as the
         devnet deployment's own origin by default. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arclis" />
    <meta
      property="og:title"
      content="Arclis - on-chain access to public markets"
    />
    <meta
      property="og:description"
      content="Look up any tokenized stock on Solana and see its real backing, custody and redemption rights. Then trade it on a perpetual that respects market hours, halts, splits and dividends."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/brand/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Arclis mark: a rising arc reaching for a detached point."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme colour follows the resolved theme, so the mobile browser chrome
         matches the page instead of framing a dark app in a light bar. -->
    <meta
      name="theme-color"
      content="#eef0ed"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b0d0a"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Fonts are self-hosted from /fonts (scripts/fetch-fonts.py). No
         third-party request on first paint, and the interface renders the same
         offline, in CI and behind a proxy. -->
    <link
      rel="preload"
      href="/fonts/pjs-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/pjs-latin-800.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      /*
       * Resolve the theme before first paint.
       *
       * This used to be a hardcoded `background` on <body>, which is why dark
       * mode stayed light: an inline style beats every stylesheet, so the dark
       * `--bg` never reached the page. Setting the attribute here instead means
       * the tokens decide the colour, and there is no flash of the wrong theme
       * on reload either.
       *
       * Storage can throw in private browsing, so a failure falls through to
       * the system preference rather than taking the page down with it.
       */
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("arclis-theme");
        } catch (e) {
          /* private browsing: fall through to the system preference */
        }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
