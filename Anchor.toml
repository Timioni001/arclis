[toolchain]
# Pinned deliberately. The Cargo.lock in this repo is resolved against the Rust
# that ships inside Solana 1.18.x platform-tools (rustc 1.75.0); moving this
# version moves that compiler and can reintroduce the edition-2024 dependency
# wall documented in BUILD.md. Read BUILD.md before changing it.
anchor_version = "0.30.1"
solana_version = "1.18.26"

[features]
resolution = true
skip-lint = false

[programs.localnet]
arclis = "BuN69a1vsMdPQx6bWjaA7FJMbnBKo6yZ66cHrdyiTbiP"

[programs.devnet]
arclis = "BuN69a1vsMdPQx6bWjaA7FJMbnBKo6yZ66cHrdyiTbiP"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[test]
# Anchor's default is 5000ms, which is not enough on a slower machine or under
# WSL: `solana-test-validator` builds a genesis ledger on first start and
# routinely takes 20 to 40 seconds. Anchor then reports "Unable to get latest
# blockhash. Test validator does not look started", which reads like a crash
# and is really a stopwatch.
#
# Waiting longer costs nothing when the validator is quick, because Anchor
# polls and proceeds as soon as it answers.
startup_wait = 90000
shutdown_wait = 5000

[scripts]
# npx rather than yarn: yarn is one more thing to install on a fresh machine,
# and npm ships with Node. Scoped to tests/arclis.ts so `anchor test` does not
# also run tests/dbc/, which needs no validator and is run by `npm run test:dbc`.
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/arclis.ts"
