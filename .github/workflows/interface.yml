# Build and test the interface on every change to it.
#
# This is a gate, not a deploy. The site is published by Cloudflare Pages,
# which builds from this repository itself on push; nothing here uploads
# anything. What this exists for is to fail loudly in a pull request when the
# interface stops typechecking, stops passing its tests, or stops building -
# before Cloudflare tries the same thing and serves the last good version
# while nobody notices the new one never shipped.
#
# It deliberately builds the way Cloudflare does: no `VITE_BASE`, so the app
# is rooted at `/`. A gate that builds differently from production is not a
# gate.
#
# It used to deploy to GitHub Pages. That was dropped when the project moved
# to Cloudflare: two publishers for one site is one more than can be right,
# and the loser of that race is whichever one a stale DNS record points at.

name: Interface

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "idl/**"
      - ".github/workflows/interface.yml"
  pull_request:
    paths:
      - "app/**"
      - "idl/**"
      - ".github/workflows/interface.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read from `app/.nvmrc` rather than pinned here.
      #
      # This was `node-version: 20`, and it was wrong: jsdom 30 needs Node
      # >= 22.22.2 and reaches it through undici, whose webidl shim
      # destructures `markAsUncloneable` from `node:worker_threads`. Node 20
      # does not have that symbol, so it became `undefined` and all five jsdom
      # suites died on import with "markAsUncloneable is not a function" -
      # after `npm ci` and `npm run typecheck` had both reported success.
      #
      # The floor now lives in exactly one file, which is also the file a
      # developer's `nvm use` reads and the file Cloudflare reads, so the three
      # cannot drift apart again. `app/.npmrc` sets `engine-strict`, so a
      # mismatch fails the install naming the version it wanted rather than a
      # stack trace inside undici four steps later.
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
