# Publish the interface to GitHub Pages.
#
# Only the frontend. The program is deployed with `anchor deploy` by someone
# holding the upgrade key, and nothing in CI has that key or should.
#
# The build is the same one `npm run app:build` produces locally, with `base`
# set because a Pages project site serves from `/<repo>/` rather than the
# domain root. Everything the build needs is in `app/.env.production`, and
# every value in it is public by construction.

name: Deploy interface

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "idl/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer commit win rather than queueing
# behind a build nobody wants any more.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read from `app/.nvmrc` rather than pinned here.
      #
      # This was `node-version: 20`, and it was wrong: jsdom 30 needs Node
      # >= 22.22.2 and reaches it through undici, whose webidl shim
      # destructures `markAsUncloneable` from `node:worker_threads`. Node 20
      # does not have that symbol, so it became `undefined` and all five jsdom
      # suites died on import with "markAsUncloneable is not a function" -
      # after `npm ci` and `npm run typecheck` had both reported success.
      #
      # The floor now lives in exactly one file, which is also the file a
      # developer's `nvm use` reads, so CI and a laptop cannot drift apart
      # again. `app/.npmrc` sets `engine-strict`, so a mismatch now fails the
      # install with the version it wanted rather than a stack trace in undici.
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      # The suite runs before the deploy, not after it. A build that fails
      # its tests should never reach the URL a judge is looking at.
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app

      - run: npm run build
        working-directory: app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
