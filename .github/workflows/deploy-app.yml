# Publish the interface to GitHub Pages.
#
# Only the frontend. The program is deployed with `anchor deploy` by someone
# holding the upgrade key, and nothing in CI has that key or should.
#
# The build is the same one `npm run app:build` produces locally, with `base`
# set because a Pages project site serves from `/<repo>/` rather than the
# domain root. Everything the build needs is in `app/.env.production`, and
# every value in it is public by construction.

name: Deploy interface

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "idl/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer commit win rather than queueing
# behind a build nobody wants any more.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      # The suite runs before the deploy, not after it. A build that fails
      # its tests should never reach the URL a judge is looking at.
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app

      - run: npm run build
        working-directory: app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
